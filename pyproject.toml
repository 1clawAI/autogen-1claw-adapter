[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogen-1claw"
version = "0.1.0a0"
description = "Vault-backed credential resolution and policy-checked tool calls for AutoGen agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "1Claw / RedBotster" }]
keywords = ["autogen", "ai-agents", "secrets", "vault", "policy", "1claw", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://x.com/1clawAI"
Repository = "https://github.com/redbotster/autogen-1claw-adapter"
"Related Adapter (LangChain)" = "https://github.com/redbotster/langchain-1claw-adapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
